# -Dfile.encoding=UTF-8을 넣지 않는다. 한글 경로의 Windows에서 이 옵션이 있으면 테스트 JVM의
# 클래스패스 인자 파일이 깨져 ClassNotFoundException이 난다(docs/learning/03-안드로이드-뼈대.md).
org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# 개발 PC의 프로젝트 경로에 한글이 있어 AGP의 Windows 경로 검사를 끈다. ASCII 경로(CI 등)에서는 영향이 없다.
android.overridePathCheck=true
